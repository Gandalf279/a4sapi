name: Build and publish desktop releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate-project:
    name: Locate Python project
    runs-on: ubuntu-latest
    outputs:
      build_dir: ${{ steps.locate.outputs.build_dir }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Find project directory
        id: locate
        shell: bash
        run: |
          if [[ -f python/requirements-build.txt && -f python/build.py ]]; then
            build_dir="python"
          elif [[ -f requirements-build.txt && -f build.py ]]; then
            build_dir="."
          elif [[ -f louisenlund-packaging/requirements-build.txt && -f louisenlund-packaging/build.py ]]; then
            build_dir="louisenlund-packaging"
          else
            echo "Could not find build.py and requirements-build.txt." >&2
            echo "Checked: python/, repository root, louisenlund-packaging/." >&2
            exit 1
          fi
          echo "build_dir=$build_dir" >> "$GITHUB_OUTPUT"
          echo "Building from: $build_dir"

  windows:
    name: Build Windows binary
    runs-on: windows-latest
    needs: locate-project
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        working-directory: ${{ needs.locate-project.outputs.build_dir }}
        run: python -m pip install -r requirements-build.txt

      - name: Build Windows package
        working-directory: ${{ needs.locate-project.outputs.build_dir }}
        run: python build.py

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: louisenlund-windows
          path: ${{ needs.locate-project.outputs.build_dir }}/artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Build macOS application
    runs-on: macos-latest
    needs: locate-project
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        working-directory: ${{ needs.locate-project.outputs.build_dir }}
        run: python -m pip install -r requirements-build.txt

      - name: Build macOS package
        working-directory: ${{ needs.locate-project.outputs.build_dir }}
        run: python build.py

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: louisenlund-macos
          path: ${{ needs.locate-project.outputs.build_dir }}/artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  linux-arch:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    needs: locate-project
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build inside official Arch Linux container
        shell: bash
        env:
          BUILD_DIR: ${{ needs.locate-project.outputs.build_dir }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/${BUILD_DIR}:/src" \
            -w /src \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed
              pacman -S --noconfirm --needed python python-pip tk base-devel
              test -f requirements-build.txt || { echo "Missing requirements-build.txt in /src" >&2; exit 1; }
              test -f build.py || { echo "Missing build.py in /src" >&2; exit 1; }
              python -m venv /tmp/louisenlund-build-venv
              . /tmp/louisenlund-build-venv/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements-build.txt
              python build.py
              test -n "$(find artifacts -maxdepth 1 -type f -name "*.tar.gz" -print -quit)"
            '

      - name: Upload Arch Linux package
        uses: actions/upload-artifact@v4
        with:
          name: louisenlund-linux-arch
          path: ${{ needs.locate-project.outputs.build_dir }}/artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish assets on GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - locate-project
      - windows
      - macos
      - linux-arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: louisenlund-*
          path: release-assets
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -ge 3

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Louisenlund Schedule ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            ## Downloads

            Download the archive matching your operating system. Extract the complete application folder and keep its contents together.

            - **Windows:** Extract the ZIP and run `LouisenlundSchedule.exe`.
            - **macOS:** Extract the ZIP and open `LouisenlundSchedule.app`.
            - **Arch Linux:** Extract the TAR.GZ and run `./run.sh` from the `LouisenlundSchedule` folder.

            Windows and macOS builds are currently unsigned. Windows may display a SmartScreen warning; macOS may require allowing the app in Privacy & Security.
