[package]
name = "school_schedule"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "school_schedule"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "socks", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "=4.4.18", features = ["derive"] }
# Pinned: newer idna/icu releases require the `edition2024` Cargo feature,
# which isn't available on older toolchains. Pin to versions that build
# with rustc 1.75+.
url = "=2.5.0"
idna = "=0.5.0"
indexmap = "=2.2.6"

[profile.release]
opt-level = 2